# /etc/nginx/sites-available/theslowshelf
#
# NESSUN RATE LIMITING su 80/443. E' deliberato: il sito misura il
# comportamento naturale dei crawler. Limitarli significherebbe misurare
# questa configurazione invece del loro comportamento.
# La protezione contro il brute force riguarda solo SSH (fail2ban).

server {
    listen 80;
    listen [::]:80;
    server_name theslowshelf.org www.theslowshelf.org;

    # ACME deve restare accessibile in HTTP per il rinnovo del certificato
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://theslowshelf.org$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.theslowshelf.org;

    ssl_certificate     /etc/letsencrypt/live/theslowshelf.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/theslowshelf.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/agentic.log agentic;
    return 301 https://theslowshelf.org$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name theslowshelf.org;

    root /var/www/theslowshelf;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/theslowshelf.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/theslowshelf.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/agentic.log agentic;
    error_log  /var/log/nginx/theslowshelf-error.log warn;

    # Compressione: i client che non la negoziano si distinguono nei log
    gzip on;
    gzip_types text/html text/plain text/xml application/xml;
    gzip_min_length 512;

    # Cache lunga sul client. Gli agenti la ignorano, ed e' precisamente
    # quello che si vuole poter osservare nei log.
    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600";
    }

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600";
    }

    # Endpoint di controllo: non compare in sitemap ne' in alcun link.
    # Ogni richiesta qui indica scoperta per forza bruta o per indovinamento
    # del percorso, non per navigazione.
    location = /canary.html {
        return 200 "canary\n";
        add_header Content-Type text/plain;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}