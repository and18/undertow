# /etc/nginx/sites-available/theslowshelf
#
# NO RATE LIMITING on 80/443. This is deliberate: the site measures the
# natural behaviour of crawlers. Limiting them would mean measuring this
# configuration instead of their behaviour.
# Brute-force protection only concerns SSH (fail2ban).

server {
    listen 80;
    listen [::]:80;
    server_name theslowshelf.org www.theslowshelf.org;

    # ACME must stay reachable over HTTP for certificate renewal
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://theslowshelf.org$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.theslowshelf.org;

    ssl_certificate     /etc/letsencrypt/live/theslowshelf.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/theslowshelf.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/agentic.log agentic;
    return 301 https://theslowshelf.org$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name theslowshelf.org;

    root /var/www/theslowshelf;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/theslowshelf.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/theslowshelf.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/agentic.log agentic;
    error_log  /var/log/nginx/theslowshelf-error.log warn;

    # Compression: clients that do not negotiate it stand out in the logs
    gzip on;
    gzip_types text/plain text/xml application/xml;
    gzip_min_length 512;

    # Long client-side cache. Agents ignore it, and that is precisely
    # what we want to be able to observe in the logs.
    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600";
    }

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600";
    }

    # Control endpoint: it appears in no sitemap and in no link.
    # Every request here indicates discovery by brute force or by guessing
    # the path, not by navigation.
    location = /canary.html {
        return 200 "canary\n";
        add_header Content-Type text/plain;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}