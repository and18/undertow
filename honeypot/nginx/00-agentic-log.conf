# /etc/nginx/conf.d/00-agentic-log.conf
#
# Log format for characterising agentic traffic.
#
# Fields not present in the standard formats, and why they are needed:
#
#   conn, conn_req   Identifier of the TCP connection and sequence number
#                    of the request within it. These are the two fields that
#                    allow measuring CONNECTION REUSE, one of the structural
#                    differences between human and agentic clients.
#                    Without them, the most interesting datum is unrecoverable.
#
#   sig_agent        Signature-Agent header (Web Bot Auth, IETF draft).
#   sig_input        Signature-Input header (RFC 9421).
#                    They make it possible to tell apart agents that
#                    authenticate cryptographically from those that only
#                    declare a forgeable user-agent.
#
#   rt               Server-side processing time: it separates the latency
#                    induced by the client from that of the server.
#
#   accept, lang     A real client negotiates content and language; many
#                    agents do not. Secondary classification signal.
#
# Note: the IP address is logged in clear because it is needed to verify
# the reverse DNS of declared crawlers. It must be anonymised before any
# publication of the dataset.

log_format agentic escape=json
  '{'
  '"t":"$time_iso8601",'
  '"ip":"$remote_addr",'
  '"m":"$request_method",'
  '"u":"$request_uri",'
  '"s":$status,'
  '"b":$body_bytes_sent,'
  '"rt":$request_time,'
  '"proto":"$server_protocol",'
  '"conn":"$connection",'
  '"conn_req":"$connection_requests",'
  '"ua":"$http_user_agent",'
  '"ref":"$http_referer",'
  '"accept":"$http_accept",'
  '"lang":"$http_accept_language",'
  '"enc":"$http_accept_encoding",'
  '"sig_agent":"$http_signature_agent",'
  '"sig_input":"$http_signature_input",'
  '"from":"$http_from",'
  # Conditional requests. Without these two fields "nobody revalidates"
  # is inferred from the response code instead of measured: a client
  # that sends a wrong If-None-Match receives 200 and is
  # indistinguishable from one that does not send it at all.
  '"inm":"$http_if_none_match",'
  '"ims":"$http_if_modified_since",'
  # Host: the www block redirects, so a client arriving on www
  # produces two log lines for one useful request. Without this field
  # the 301s are indistinguishable from real traffic.
  '"host":"$host"'
  '}';

# The nginx default is 1000, and three operators hit exactly that
# ceiling: all connection-reuse measurements are lower bounds as long as
# it stays that way.
keepalive_requests 100000;
keepalive_timeout 120s;

server_tokens off;