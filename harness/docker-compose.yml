# harness/docker-compose.yml
#
# Sistema sotto test + osservazione.
#
# Le CPU sono fissate per container (cpuset) perche' senza questo non si puo'
# dimostrare quale componente sia il collo di bottiglia. La ripartizione
# assume almeno 8 core; adattare CPUSET_* in .env su macchine piu' piccole.
#
# Il generatore di carico NON e' qui: gira separatamente (vedi harness/load/).
#
#   docker compose up -d
#   docker compose --profile load run --rm k6 run /scripts/null-test.js

name: undertow

services:

  # ---------------------------------------------------------------- cache --
  varnish:
    image: varnish:7.5
    container_name: ut-varnish
    cpuset: "${CPUSET_VARNISH:-2}"
    mem_limit: 2g
    volumes:
      - ./varnish/default.vcl:/etc/varnish/default.vcl:ro
      - varnishwork:/var/lib/varnish
    # -n fissa la working directory: senza, varnishd usa una cartella
    # basata sull'hostname e l'exporter non la trova.
    command: >
      varnishd -F -f /etc/varnish/default.vcl
      -n /var/lib/varnish/ut
      -a http=:80,HTTP
      -s malloc,${VARNISH_SIZE:-256m}
      -p thread_pool_min=50 -p thread_pool_max=1000
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      app:
        condition: service_healthy
    networks: [ut]

  varnish-exporter:
    build: ./varnish
    container_name: ut-varnish-exporter
    cpuset: "${CPUSET_OBS:-7}"
    volumes:
      - varnishwork:/var/lib/varnish
    depends_on: [varnish]
    networks: [ut]

  # ------------------------------------------------------------------ app --
  app:
    build: ./app
    container_name: ut-app
    cpuset: "${CPUSET_APP:-3,4}"
    mem_limit: 2g
    volumes:
      # Montato durante lo sviluppo: elimina l'ambiguita' sul fatto che il
      # container esegua la versione corrente. Da rimuovere prima della
      # campagna finale, cosi' l'immagine e' autocontenuta.
      - ./app/app.py:/srv/app.py:ro
    environment:
      # --- variabili di sweep: il pool e' la risorsa limitata --------------
      THREADS: "${THREADS:-32}"
      BACKLOG: "${BACKLOG:-256}"
      DB_POOL_MIN: "${DB_POOL_MIN:-2}"
      DB_POOL_MAX: "${DB_POOL_MAX:-16}"
      BUDGET_LOW: "${BUDGET_LOW:-0}"
      BUDGET_WAIT: "${BUDGET_WAIT:-0.5}"
      # --------------------------------------------------------------------
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: undertow
      PGUSER: undertow
      PGPASSWORD: undertow
      CACHE_TTL: "${CACHE_TTL:-3600}"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
    networks: [ut]

  # ------------------------------------------------------------------- db --
  db:
    image: postgres:16-alpine
    container_name: ut-db
    cpuset: "${CPUSET_DB:-5}"
    mem_limit: 2g
    environment:
      POSTGRES_DB: undertow
      POSTGRES_USER: undertow
      POSTGRES_PASSWORD: undertow
    command: >
      postgres
      -c max_connections=100
      -c shared_buffers=256MB
      -c track_io_timing=on
      -c log_min_duration_statement=1000
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U undertow"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [ut]

  db-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: ut-db-exporter
    cpuset: "${CPUSET_OBS:-7}"
    environment:
      DATA_SOURCE_NAME: "postgresql://undertow:undertow@db:5432/undertow?sslmode=disable"
    depends_on: [db]
    networks: [ut]

  # --------------------------------------------------------- osservazione --
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.102.1
    container_name: ut-vm
    cpuset: "${CPUSET_OBS:-7}"
    command:
      - "-storageDataPath=/vm"
      - "-retentionPeriod=6"
      - "-promscrape.config=/etc/scrape.yml"
    volumes:
      - vmdata:/vm
      - ./observability/scrape.yml:/etc/scrape.yml:ro
    ports:
      - "127.0.0.1:8428:8428"
    networks: [ut]

  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: ut-node-exporter
    cpuset: "${CPUSET_OBS:-7}"
    # In WSL2 il mount di / con rslave non e' supportato. Si montano
    # solo /proc e /sys, che sono le fonti effettivamente usate per CPU,
    # memoria, rete e socket: le metriche filesystem non servono qui.
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.processes"
      - "--no-collector.filesystem"
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    networks: [ut]

  grafana:
    image: grafana/grafana:11.1.0
    container_name: ut-grafana
    cpuset: "${CPUSET_OBS:-7}"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: undertow
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [victoriametrics]
    networks: [ut]

  # ------------------------------------------------------------ strumenti --
  loader:
    build: ./app
    container_name: ut-loader
    profiles: ["tools"]
    cpuset: "${CPUSET_APP:-3,4}"
    environment:
      PGHOST: db
      PGDATABASE: undertow
      PGUSER: undertow
      PGPASSWORD: undertow
    volumes:
      - ../cache:/corpus:ro
      # Montato invece che copiato nell'immagine: elimina ogni ambiguita'
      # sul fatto che il container esegua la versione corrente del file.
      - ./app/load_corpus.py:/srv/load_corpus.py:ro
    command: ["python", "/srv/load_corpus.py", "--corpus", "/corpus"]
    depends_on:
      db:
        condition: service_healthy
    networks: [ut]

  k6:
    image: grafana/k6:0.52.0
    container_name: ut-k6
    profiles: ["load"]
    cpuset: "${CPUSET_K6:-0,1}"
    environment:
      TARGET: "${TARGET:-http://varnish:80}"
    volumes:
      - ./load:/scripts:ro
      - ./results:/results
    networks: [ut]

  # ----------------------------------------------------------- split profile --
  varnish-h:
    build:
      context: ./varnish
      dockerfile: Dockerfile.varnish
    container_name: ut-varnish-h
    profiles: ["split"]
    cpuset: "${CPUSET_VARNISH:-1}"
    mem_limit: 2g
    environment:
      VARNISH_SIZE: "${VARNISH_H_SIZE:-128m}"
      VARNISH_BACKEND: "app:8000"
    depends_on:
      app:
        condition: service_healthy
    networks: [ut]

  varnish-l:
    build:
      context: ./varnish
      dockerfile: Dockerfile.varnish
    container_name: ut-varnish-l
    profiles: ["split"]
    cpuset: "${CPUSET_VARNISH:-1}"
    mem_limit: 2g
    environment:
      VARNISH_SIZE: "${VARNISH_L_SIZE:-1m}"
      VARNISH_BACKEND: "app:8000"
    depends_on:
      app:
        condition: service_healthy
    networks: [ut]

  router:
    image: nginx:1.27-alpine
    container_name: ut-router
    profiles: ["split"]
    cpuset: "${CPUSET_VARNISH:-1}"
    volumes:
      - ./nginx/router.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - varnish-h
      - varnish-l
    networks: [ut]

volumes:
  pgdata:
  vmdata:
  grafanadata:
  varnishwork:

networks:
  ut:
    driver: bridge