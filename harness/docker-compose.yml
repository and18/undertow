# harness/docker-compose.yml
#
# System under test + observation.
#
# CPUs are pinned per container (cpuset) because without this one cannot
# show which component is the bottleneck. The partitioning assumes at
# least 8 cores; adapt CPUSET_* in .env on smaller machines.
#
# The load generator is NOT here: it runs separately (see harness/load/).
#
#   docker compose up -d
#   docker compose --profile load run --rm k6 run /scripts/null-test.js

name: undertow

services:

  # ---------------------------------------------------------------- cache --
  varnish:
    image: varnish:7.5
    container_name: ut-varnish
    cpuset: "${CPUSET_VARNISH:-2}"
    mem_limit: 2g
    volumes:
      - ./varnish/default.vcl:/etc/varnish/default.vcl:ro
      - varnishwork:/var/lib/varnish
    # -n fixes the working directory: without it, varnishd uses a folder
    # based on the hostname and the exporter cannot find it.
    command: >
      varnishd -F -f /etc/varnish/default.vcl
      -n /var/lib/varnish/ut
      -a http=:80,HTTP
      -s malloc,${VARNISH_SIZE:-256m}
      -p thread_pool_min=50 -p thread_pool_max=1000
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      app:
        condition: service_healthy
    networks: [ut]

  varnish-exporter:
    build: ./varnish
    container_name: ut-varnish-exporter
    cpuset: "${CPUSET_OBS:-7}"
    volumes:
      - varnishwork:/var/lib/varnish
    depends_on: [varnish]
    networks: [ut]

  # ------------------------------------------------------------------ app --
  app:
    build: ./app
    container_name: ut-app
    cpuset: "${CPUSET_APP:-3,4}"
    mem_limit: 2g
    volumes:
      # Mounted during development: removes any doubt that the container
      # runs the current version. To be removed before the final campaign,
      # so that the image is self-contained.
      - ./app/app.py:/srv/app.py:ro
    environment:
      # --- sweep variables: the pool is the limited resource ---------------
      THREADS: "${THREADS:-32}"
      BACKLOG: "${BACKLOG:-256}"
      DB_POOL_MIN: "${DB_POOL_MIN:-2}"
      DB_POOL_MAX: "${DB_POOL_MAX:-16}"
      BUDGET_LOW: "${BUDGET_LOW:-0}"
      BLOCK_CLASSES: "${BLOCK_CLASSES:-}"
      BUDGET_WAIT: "${BUDGET_WAIT:-0.5}"
      # --------------------------------------------------------------------
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: undertow
      PGUSER: undertow
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in harness/.env (see .env.example)}
      CACHE_TTL: "${CACHE_TTL:-3600}"
      OBJECT_TTL: "${OBJECT_TTL:-0}"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
    networks: [ut]

  # ------------------------------------------------------------------- db --
  db:
    image: postgres:16-alpine
    container_name: ut-db
    cpuset: "${CPUSET_DB:-5}"
    mem_limit: 2g
    environment:
      POSTGRES_DB: undertow
      POSTGRES_USER: undertow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in harness/.env (see .env.example)}
    command: >
      postgres
      -c max_connections=100
      -c shared_buffers=256MB
      -c track_io_timing=on
      -c log_min_duration_statement=1000
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U undertow"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [ut]

  db-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: ut-db-exporter
    cpuset: "${CPUSET_OBS:-7}"
    environment:
      DATA_SOURCE_NAME: "postgresql://undertow:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in harness/.env (see .env.example)}@db:5432/undertow?sslmode=disable"
    depends_on: [db]
    networks: [ut]

  # ------------------------------------------------------- observation --
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.102.1
    container_name: ut-vm
    cpuset: "${CPUSET_OBS:-7}"
    command:
      - "-storageDataPath=/vm"
      - "-retentionPeriod=6"
      - "-promscrape.config=/etc/scrape.yml"
    volumes:
      - vmdata:/vm
      - ./observability/scrape.yml:/etc/scrape.yml:ro
    ports:
      - "127.0.0.1:8428:8428"
    networks: [ut]

  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: ut-node-exporter
    cpuset: "${CPUSET_OBS:-7}"
    # In WSL2 mounting / with rslave is not supported. Only /proc and /sys
    # are mounted, which are the sources actually used for CPU, memory,
    # network and sockets: filesystem metrics are not needed here.
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.processes"
      - "--no-collector.filesystem"
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    networks: [ut]

  grafana:
    image: grafana/grafana:11.1.0
    container_name: ut-grafana
    cpuset: "${CPUSET_OBS:-7}"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in harness/.env (see .env.example)}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [victoriametrics]
    networks: [ut]

  # --------------------------------------------------------------- tools --
  loader:
    build: ./app
    container_name: ut-loader
    profiles: ["tools"]
    cpuset: "${CPUSET_APP:-3,4}"
    environment:
      PGHOST: db
      PGDATABASE: undertow
      PGUSER: undertow
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in harness/.env (see .env.example)}
    volumes:
      - ../cache:/corpus:ro
      # Mounted instead of copied into the image: removes any doubt that
      # the container runs the current version of the file.
      - ./app/load_corpus.py:/srv/load_corpus.py:ro
    command: ["python", "/srv/load_corpus.py", "--corpus", "/corpus"]
    depends_on:
      db:
        condition: service_healthy
    networks: [ut]

  k6:
    image: grafana/k6:0.52.0
    container_name: ut-k6
    profiles: ["load"]
    cpuset: "${CPUSET_K6:-0,1}"
    environment:
      TARGET: "${TARGET:-http://varnish:80}"
    volumes:
      - ./load:/scripts:ro
      - ./results:/results
    networks: [ut]

  # ----------------------------------------------------------- split profile --
  varnish-h:
    image: varnish:7.5
    container_name: ut-varnish-h
    profiles: ["split"]
    cpuset: "${CPUSET_VARNISH:-2}"
    mem_limit: 2g
    volumes:
      - ./varnish/default.vcl:/etc/varnish/default.vcl:ro
      # Separate working directory per instance: two varnishd processes
      # sharing the same folder overwrite each other.
      - varnishwork-h:/var/lib/varnish
    command: >
      varnishd -F -f /etc/varnish/default.vcl
      -n /var/lib/varnish/ut
      -a http=:80,HTTP
      -s malloc,${VARNISH_H_SIZE:-128m}
      -p thread_pool_min=50 -p thread_pool_max=1000
    depends_on:
      app:
        condition: service_healthy
    networks: [ut]

  varnish-l:
    image: varnish:7.5
    container_name: ut-varnish-l
    profiles: ["split"]
    cpuset: "${CPUSET_VARNISH:-2}"
    mem_limit: 2g
    volumes:
      - ./varnish/default.vcl:/etc/varnish/default.vcl:ro
      - varnishwork-l:/var/lib/varnish
    command: >
      varnishd -F -f /etc/varnish/default.vcl
      -n /var/lib/varnish/ut
      -a http=:80,HTTP
      -s malloc,${VARNISH_L_SIZE:-1m}
      -p thread_pool_min=50 -p thread_pool_max=1000
    depends_on:
      app:
        condition: service_healthy
    networks: [ut]

  router:
    image: nginx:1.27-alpine
    container_name: ut-router
    profiles: ["split"]
    cpuset: "${CPUSET_VARNISH:-1}"
    volumes:
      - ./nginx/router.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/router.active.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - varnish-h
      - varnish-l
    networks: [ut]

volumes:
  pgdata:
  vmdata:
  grafanadata:
  varnishwork:
  varnishwork-h:
  varnishwork-l:

networks:
  ut:
    driver: bridge