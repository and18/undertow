# Instrada per classe di traffico verso cache separate.
#
# Simula una scan-resistance perfetta: la classe ad alta localita' ha
# una partizione riservata che la classe esaustiva non puo' sfrattare.
# E' la proposta di Zhang et al. (SoCC 2025) portata all'estremo, per
# misurarne il costo all'origine.
#
# La configurazione di riferimento instrada ENTRAMBE le classi alla
# stessa istanza: cosi' il confronto e' fra due politiche, non fra due
# architetture — anche il riferimento paga l'hop in piu' di nginx.

map $http_user_agent $cache_upstream {
    default            "varnish-high";
    "~*lowloc"         "varnish-low";
}

upstream varnish-high { server varnish-h:80; keepalive 64; }
upstream varnish-low  { server varnish-l:80; keepalive 64; }

server {
    listen 80;
    location / {
        proxy_pass http://$cache_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header User-Agent $http_user_agent;
        proxy_pass_request_headers on;
    }
}