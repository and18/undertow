# observability/scrape.yml
#
# 1-second resolution. It is unusually high for a metrics system, but
# necessary: the collapse of the system is a transient that at a 15-second
# interval shows up as a single point, while its dynamics are exactly
# what we are measuring.

global:
  scrape_interval: 1s
  scrape_timeout: 900ms

scrape_configs:

  - job_name: app
    static_configs:
      - targets: ["app:9000"]

  - job_name: varnish
    static_configs:
      - targets: ["varnish-exporter:9131"]

  - job_name: postgres
    static_configs:
      - targets: ["db-exporter:9187"]
    # Postgres system queries are expensive: at 1s they would perturb the
    # target. The lower resolution here is deliberate.
    scrape_interval: 5s

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]