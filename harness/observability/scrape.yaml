# observability/scrape.yml
#
# Risoluzione 1 secondo. E' insolitamente alta per un sistema di metriche,
# ma necessaria: il collasso del sistema e' un transitorio che a 15 secondi
# di intervallo appare come un singolo punto, mentre la sua dinamica e'
# proprio l'oggetto della misura.

global:
  scrape_interval: 1s
  scrape_timeout: 900ms

scrape_configs:

  - job_name: app
    static_configs:
      - targets: ["app:9000"]

  - job_name: varnish
    static_configs:
      - targets: ["varnish-exporter:9131"]

  - job_name: postgres
    static_configs:
      - targets: ["db-exporter:9187"]
    # Le query di sistema di Postgres sono costose: a 1s si perturberebbe
    # il bersaglio. Qui la risoluzione piu' bassa e' deliberata.
    scrape_interval: 5s

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]